name: Build ObsidianX C++ Core

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify emission math (no uint64 overflow)
        run: |
          python3 - << 'PYEOF'
          COIN = 10**12
          CAP = 18_000_000 * COIN
          TAIL = 600_000_000_000
          assert CAP < (1 << 64), "uint64 overflow!"
          first = CAP >> 20
          assert 17 * COIN < first < 18 * COIN, f"Unexpected first reward: {first/COIN}"
          gen = 0
          for _ in range(10000):
              r = TAIL if gen >= CAP else max(TAIL, (CAP - gen) >> 20)
              gen += r
          print(f"Emission test OK: first_reward={first/COIN:.6f} OBX, 10k_blocks={gen/COIN:.2f} OBX")
          PYEOF
      - name: Install Monero/ObsidianX build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libssl-dev libzmq3-dev \
            libunbound-dev libsodium-dev libunwind8-dev liblzma-dev libreadline-dev \
            libldns-dev libexpat1-dev libboost-all-dev python3 git ccache zip
      - name: Apply ObsidianX patches and configure CMake
        run: |
          chmod +x scripts/07_apply_all_params.sh
          ./scripts/07_apply_all_params.sh
      - name: Compile daemon, simplewallet, and wallet-rpc
        run: |
          cd ~/obsidianx/core-chain/build/release
          make -j$(nproc) daemon simplewallet wallet_rpc_server
          mv bin/monerod bin/obsidianxd
          mv bin/monero-wallet-cli bin/obsidianx-wallet-cli
          mv bin/monero-wallet-rpc bin/obsidianx-wallet-rpc
          cp "$GITHUB_WORKSPACE/LICENSE" bin/LICENSE
          sha256sum bin/obsidianxd bin/obsidianx-wallet-cli bin/obsidianx-wallet-rpc bin/LICENSE > bin/SHA256SUMS-linux.txt
          zip -j bin/obsidianx-linux-x86_64.zip bin/obsidianxd bin/obsidianx-wallet-cli bin/obsidianx-wallet-rpc bin/LICENSE bin/SHA256SUMS-linux.txt
      - name: Upload compiled Linux binaries
        uses: actions/upload-artifact@v4
        with:
          name: obsidianx-linux-x86_64
          path: |
            ~/obsidianx/core-chain/build/release/bin/obsidianxd
            ~/obsidianx/core-chain/build/release/bin/obsidianx-wallet-cli
            ~/obsidianx/core-chain/build/release/bin/obsidianx-wallet-rpc
            ~/obsidianx/core-chain/build/release/bin/SHA256SUMS-linux.txt
            ~/obsidianx/core-chain/build/release/bin/obsidianx-linux-x86_64.zip

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ build-linux ]
    runs-on: ubuntu-22.04
    steps:
      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            dist/obsidianx-linux-x86_64/obsidianx-linux-x86_64.zip
            dist/obsidianx-linux-x86_64/SHA256SUMS-linux.txt